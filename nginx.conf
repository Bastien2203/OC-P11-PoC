worker_processes auto;
worker_rlimit_nofile 10000;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=geocache:10m max_size=1g inactive=48h use_temp_path=off;


    upstream backend_api {
        least_conn;
        server emergency-bed-service:8080;
        keepalive 200;
    }

    log_format upstream_log '[$time_local] Requête vers: $upstream_addr | Temps de réponse: $upstream_response_time sec | Statut: $status';
    access_log /var/log/nginx/access.log upstream_log;
    
    server {
        listen 80;
        server_name localhost;


        location / {
            proxy_pass http://backend_api;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        }

        location /api-geo/ {
            proxy_pass https://data.geopf.fr/geocodage/;
            
            proxy_ssl_server_name on;
            proxy_set_header Host data.geopf.fr;

            proxy_cache geocache;
            
            proxy_ignore_headers Cache-Control Expires;
            
            proxy_cache_valid 200 48h; 
            proxy_cache_valid 404 400 1m;

            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}